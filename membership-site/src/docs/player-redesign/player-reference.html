<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player redesign · reference</title>
<!--
  Visual + behavioral reference for the SleepCode player redesign.
  NOT production code. Implement in React/Tailwind per docs/player-redesign/PLAYER_REDESIGN_SPEC.md.
  URL params for states: ?open=voice|width|repeat|volume  &playing=1  &view=states
-->
<style>
  :root{
    --p-bg:#233230; --p-bg-playing:#0f1615; --p-fg:#e7e1d6; --p-muted:#a9b3ae;
    --p-accent:#7fb8b1; --p-on-accent:#14100e; --p-track:rgba(231,225,214,.18);
    --p-chip-border:rgba(231,225,214,.2); --p-sheet:#1c2827;
    /* NEW tokens */
    --p-panel:#2b3a38; --p-panel-border:rgba(231,225,214,.12); --p-tile-active:#31474a;
    --p-well:#1c2827; --p-step-outline:#627673; --p-today:#e8c9a0;
    --p-voice-bright:rgb(176,224,218); --p-voice-deep:rgb(56,96,92);
    --p-pulse-bright:rgb(168,174,171); --p-pulse-deep:rgb(62,72,70);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#111;font-family:"Hanken Grotesk",-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--p-fg)}
  button{font-family:inherit;color:inherit;cursor:pointer}
  .phone{width:390px;height:844px;margin:0 auto;background:var(--p-bg);display:flex;flex-direction:column;padding:12px 22px 24px;transition:background 2.6s ease;overflow:hidden}
  .phone.playing{background:var(--p-bg-playing)}
  .top{display:flex;align-items:center;justify-content:space-between;height:48px;color:var(--p-muted);font-size:15px}
  .top .right{display:flex;gap:8px}
  .pill{min-height:44px;border-radius:999px;border:1px solid var(--p-chip-border);background:none;padding:0 16px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
  .round{width:44px;height:44px;border-radius:22px;border:1px solid var(--p-chip-border);background:none;font-family:ui-monospace,monospace;font-size:15px}
  .stage{position:relative;width:230px;height:230px;margin:6px auto 0}
  .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid var(--p-accent);opacity:.26}
  .playing .ring{animation:scGlow 6s ease-in-out infinite}
  @keyframes scGlow{0%,100%{opacity:.22;box-shadow:none}30%{opacity:1;box-shadow:0 0 16px 1px var(--p-accent),inset 0 0 12px 0 var(--p-accent)}65%{opacity:.3;box-shadow:none}}
  @media (prefers-reduced-motion:reduce){.playing .ring{animation:none;opacity:.5}}
  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:42px;border:0;background:var(--p-accent);color:var(--p-on-accent);display:grid;place-items:center}
  .title{text-align:center;margin-top:6px}
  .title h1{margin:0;font-size:26px;font-weight:500;letter-spacing:-.02em}
  .dots{display:flex;justify-content:center;gap:14px;margin-top:12px}
  .day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--p-muted)}
  .dot{width:8px;height:8px;border-radius:4px;box-sizing:border-box}
  .dot.on{background:var(--p-accent)} .dot.off{border:1.5px solid #5d706d} .dot.today{border:1.5px solid var(--p-today)}
  .day.is-today{color:var(--p-today);font-weight:600}
  .spacer{flex:1}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .tile{height:72px;border-radius:16px;border:1px solid var(--p-panel-border);background:var(--p-panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;font-size:13px}
  .tile[aria-expanded="true"]{border:1.5px solid var(--p-accent);background:var(--p-tile-active)}
  .panel{margin-top:10px;padding:16px;border-radius:18px;background:var(--p-panel);border:1px solid var(--p-panel-border);display:flex;flex-direction:column;gap:12px}
  .panel[hidden]{display:none}
  .plabel{font-size:14px;color:var(--p-muted)}
  .big{font-size:20px;font-weight:600}
  /* Voice steps */
  .voice-row{display:flex;align-items:center;gap:10px}
  .steps{flex:1;display:flex;gap:3px;height:32px;touch-action:none;cursor:pointer}
  .step{flex:1;border-radius:4px}
    /* Volume fill */
  .fill{position:relative;height:60px;border-radius:18px;background:var(--p-well);overflow:hidden;touch-action:none;cursor:pointer}
  .fill .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:18px;font-weight:600}
  .fill .light{color:var(--p-fg)}
  .fill .dark{background:var(--p-accent);color:var(--p-on-accent)}
  /* Option grids */
  .opts{display:grid;gap:6px}
  .opt{height:60px;border-radius:12px;border:1px solid var(--p-chip-border);background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px}
  .opt[aria-checked="true"]{background:var(--p-fg);color:var(--p-on-accent);border-color:var(--p-fg);font-weight:600}
  /* States sheet */
  .sheet{width:1240px;margin:0 auto;padding:40px;background:var(--p-bg)}
  .sheet h2{margin:0 0 16px;font-size:22px;font-weight:600}
  .sheet .row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:36px}
  .sheet .cap{font-size:13px;color:var(--p-muted);margin-top:8px;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const state = {
  instruction: 75, volume: 60, repeat: 1, pulseWidth: 66, lengthMinutes: 480,
  open: P.get('open') || null, playing: P.get('playing') === '1',
  // last 7 local days, oldest first; today last. true = listened ≥ 1 min that night.
  history: [true, true, true, false, true, true, false],
};
const STEPS = 20;
const lerp=(a,b,t)=>`rgb(${a.map((c,k)=>Math.round(c+(b[k]-c)*t)).join(',')})`;
// Voice = teal, brightest at the voice icon (left). Pulse = gray, brightest at the pulse icon (right).
const voiceColor=(i)=>lerp([56,96,92],[176,224,218],1-i/(STEPS-1));
const pulseColor=(i)=>lerp([62,72,70],[168,174,171],i/(STEPS-1));
const WIDTHS = [[0,'Center'],[33,'Narrow'],[66,'Wide'],[100,'Full']];
const REPEATS = [[1,'Once'],[2,'Twice'],[4,'Four times']];
const repeatShort = {1:'Once',2:'Twice',4:'4 times'};
const fmtLen = (m) => m == null ? 'Length' : m < 60 ? `${m} min` : m % 60 === 0 ? `${m/60} hr` : `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;

const I = {
  voice:(s=20,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M17 6.5a4 4 0 010 5"/><path d="M19.5 4a7.5 7.5 0 010 10"/></svg>`,
  pulse:(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--p-fg)" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="2" fill="var(--p-fg)"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10"/></svg>`,
  moon:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>`,
  doc:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`,
  stopwatch:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>`,
  repeat:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/></svg>`,
  speaker:(v,c='currentColor')=>`<svg width="22" height="22" viewBox="0 0 26 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/>${v===0?'<path d="M17 9l5 6M22 9l-5 6"/>':'<path d="M16.5 9a4 4 0 010 6"/>'}${v>=67?'<path d="M19.5 6a8 8 0 010 12"/>':''}</svg>`,
  play:`<svg width="26" height="26" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" style="transform:translateX(2px)"><path d="M4 2.2 L13.5 8 L4 13.8 Z"/></svg>`,
  pause:`<svg width="26" height="26" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx=".6"/><rect x="9.5" y="2.5" width="3" height="11" rx=".6"/></svg>`,
  width:(w,c1='var(--p-step-outline)',c2='var(--p-accent)')=>{const span={0:0,33:12,66:22,100:34}[w];return `<svg width="34" height="6" viewBox="0 0 34 6" aria-hidden="true"><rect x="0" y="1" width="34" height="4" rx="2" fill="${c1}"/>${w===0?`<circle cx="17" cy="3" r="3" fill="${c2}"/>`:`<rect x="${(34-span)/2}" y="1" width="${span}" height="4" rx="2" fill="${c2}"/>`}</svg>`;},
};

function voiceSteps(instruction){
  const on = Math.round(instruction/5);
  return Array.from({length:STEPS},(_,i)=>`<div class="step" style="background:${i<on?voiceColor(i):pulseColor(i)}"></div>`).join('');
}
function voiceControl(instruction){
  return `<div class="plabel">Voice to pulse blend</div>
  <div class="big">${instruction}%</div>
  <div class="voice-row">${I.voice(22,'var(--p-accent)')}
    <div class="steps" data-voice role="slider" tabindex="0" aria-label="Voice level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${instruction}" aria-valuetext="Voice ${instruction}%">${voiceSteps(instruction)}</div>
  ${I.pulse(22)}</div>`;
}
function volumeControl(v){
  return `<div class="fill" data-volume role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}" aria-valuetext="${v}%">
    <div class="layer light">${I.speaker(v)}<span>${v}%</span></div>
    <div class="layer dark" aria-hidden="true" style="clip-path:inset(0 ${100-v}% 0 0)">${I.speaker(v)}<span>${v}%</span></div>
  </div>`;
}
function dots(){
  const now = new Date(); const L='SMTWTFS';
  return state.history.map((on,k)=>{const d=new Date(now);d.setDate(now.getDate()-(6-k));const today=k===6;
    const cls= on?'on': today?'today':'off';
    return `<div class="day ${today?'is-today':''}"><div class="dot ${cls}"></div>${L[d.getDay()]}</div>`;}).join('');
}
function tile(id,icon,label){return `<button class="tile" data-tile="${id}" aria-expanded="${state.open===id}" aria-controls="panel-${id}">${icon}<span>${label}</span></button>`;}

function phone(){
  const s=state;
  return `<div class="phone ${s.playing?'playing':''}">
    <div class="top"><span>&lsaquo; Back</span><div class="right">
      <button class="round" aria-label="Transcript" style="font-family:inherit;display:grid;place-items:center">${I.doc}</button>
      <button class="round" aria-label="Before you start">?</button>
      <button class="pill" data-shade>${I.moon}Night shade</button></div></div>
    <div class="stage">${[34,55,76,97].map((p,i)=>`<div class="ring" style="width:${p}%;height:${p}%;animation-delay:${.7+i*.7}s"></div>`).join('')}
      <button class="play" data-play aria-label="${s.playing?'Pause':'Play'}">${s.playing?I.pause:I.play}</button></div>
    <div class="title"><h1>Fresh Start · Mindset</h1></div>
    <div class="dots" role="img" aria-label="Listening over the last 7 nights">${dots()}</div>
    <div class="spacer"></div>
    <div class="tiles">
      ${tile('timer',I.stopwatch,fmtLen(s.lengthMinutes))}
      ${tile('voice',I.voice(18,'var(--p-accent)'),s.instruction+'%')}
      ${tile('width',I.width(s.pulseWidth,'var(--p-step-outline)','var(--p-accent)'),WIDTHS.find(w=>w[0]===s.pulseWidth)[1])}
      ${tile('repeat',I.repeat,repeatShort[s.repeat])}
      ${tile('volume',I.speaker(s.volume),s.volume+'%')}
    </div>
    <div class="panel" id="panel-voice" ${s.open==='voice'?'':'hidden'}>${voiceControl(s.instruction)}</div>
    <div class="panel" id="panel-width" ${s.open==='width'?'':'hidden'}><div class="plabel">Pulse width</div>
      <div class="opts" role="radiogroup" aria-label="Pulse width" style="grid-template-columns:repeat(4,1fr)">${WIDTHS.map(([w,l])=>`<button class="opt" role="radio" data-width="${w}" aria-checked="${s.pulseWidth===w}">${I.width(w, s.pulseWidth===w?'#9aa6a2':'var(--p-step-outline)', s.pulseWidth===w?'#2f6f6c':'var(--p-fg)')}${l}</button>`).join('')}</div></div>
    <div class="panel" id="panel-repeat" ${s.open==='repeat'?'':'hidden'}><div class="plabel">Repeat each statement</div>
      <div class="opts" role="radiogroup" aria-label="Repeat each statement" style="grid-template-columns:repeat(3,1fr)">${REPEATS.map(([n,l])=>`<button class="opt" role="radio" data-repeat="${n}" aria-checked="${s.repeat===n}"><svg width="40" height="8" viewBox="0 0 40 8" aria-hidden="true">${Array.from({length:n},(_,k)=>`<circle cx="${20-(n-1)*5+k*10}" cy="4" r="3.5" fill="currentColor"/>`).join('')}</svg>${l}</button>`).join('')}</div></div>
    <div class="panel" id="panel-volume" ${s.open==='volume'?'':'hidden'}>${volumeControl(s.volume)}</div>
  </div>`;
}

function statesSheet(){
  const card=(inner,cap)=>`<div><div class="panel" style="margin:0">${inner}</div><div class="cap">${cap}</div></div>`;
  return `<div class="sheet">
    <h2>Voice (teal, left) / pulse (gray, right) · 20 steps</h2>
    <div class="row" style="grid-template-columns:repeat(5,1fr)">${[0,25,50,75,100].map(v=>card(voiceControl(v),`instruction = ${v}`)).join('')}</div>
    <h2>Volume · fill bar · text and icon split at the fill edge</h2>
    <div class="row">${[0,60,85,100].map(v=>card(volumeControl(v),`volume = ${v}`)).join('')}</div>
    <h2>Pulse width glyphs</h2>
    <div class="row">${WIDTHS.map(([w,l])=>card(`<div style="display:flex;align-items:center;gap:12px">${I.width(w,'var(--p-step-outline)','var(--p-accent)')}<span>${l}</span></div>`,`pulseWidth = ${w}`)).join('')}</div>
  </div>`;
}

function render(){
  document.getElementById('root').innerHTML = P.get('view')==='states' ? statesSheet() : phone();
  bind();
}
function dragBind(el, fn){
  if(!el) return;
  const set=(x)=>{const r=el.getBoundingClientRect();fn(Math.min(1,Math.max(0,(x-r.left)/r.width)));};
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);set(e.clientX);});
  el.addEventListener('pointermove',e=>{if(el.hasPointerCapture(e.pointerId))set(e.clientX);});
}
function bind(){
  document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.tile;
    if(id==='timer'){console.log('Timer tile opens the existing Session length sheet (hours 0–10 × minutes).');return;}
    state.open = state.open===id ? null : id; render();
  });
  const play=document.querySelector('[data-play]'); if(play) play.onclick=()=>{state.playing=!state.playing;render();};
  // Drags update the control in place so pointer capture survives.
  const vEl=document.querySelector('[data-voice]');
  dragBind(vEl, t=>{const v=Math.min(100,Math.max(0,Math.round(t*STEPS)*5)); if(v===state.instruction)return; state.instruction=v;
    vEl.innerHTML=voiceSteps(v); vEl.setAttribute('aria-valuenow',v); vEl.setAttribute('aria-valuetext',`Voice ${v}%`);
    vEl.closest('.panel').querySelector('.big').textContent=v+'%';
    document.querySelector('[data-tile="voice"] span').textContent=v+'%';});
  const volEl=document.querySelector('[data-volume]');
  dragBind(volEl, t=>{const v=Math.round(t*100); if(v===state.volume)return; state.volume=v;
    volEl.querySelectorAll('span').forEach(s=>s.textContent=v+'%');
    volEl.querySelectorAll('.layer').forEach(l=>l.querySelector('svg').outerHTML=I.speaker(v));
    volEl.querySelector('.dark').style.clipPath=`inset(0 ${100-v}% 0 0)`; volEl.setAttribute('aria-valuenow',v); volEl.setAttribute('aria-valuetext',v+'%');
    const tl=document.querySelector('[data-tile="volume"]'); tl.innerHTML=I.speaker(v)+`<span>${v}%</span>`;});
  document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{state.pulseWidth=+b.dataset.width;render();});
  document.querySelectorAll('[data-repeat]').forEach(b=>b.onclick=()=>{state.repeat=+b.dataset.repeat;render();});
}
render();
</script>
</body>
</html>
